name: Idea Catcher — Telegram to Notion

on:
  schedule:
    - cron: '0 * * * *'      # hourly — plenty for ideas, stays inside the free tier
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to commit the offset + usage counter back

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-small-v1

      - run: pip install -r requirements.txt

      - name: Pull ideas into Notion
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          WHISPER_MODEL: small
        run: python pull_to_notion.py

      - name: Save offset + usage (so ideas aren't fetched twice)
        run: |
          git config user.name "idea-catcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pull_offset.json usage_guard.json
          git commit -m "update offset [skip ci]" || echo "no change"
          git push
